<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ASHFALL — 2.5D 3D Fighter</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #game{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;font-family:Impact,'Arial Black',sans-serif;
    color:#ffd9a0;text-shadow:0 2px 6px #000}
  .barWrap{position:absolute;top:calc(16px + env(safe-area-inset-top));width:36%;height:24px;
    background:linear-gradient(180deg,#241014,#12080a);border:2px solid #8a5a30;
    box-shadow:0 0 0 2px #1a0c08,0 2px 10px #000,inset 0 0 8px #000;transform:skewX(-14deg);overflow:hidden}
  #wrap1{left:7%} #wrap2{right:7%;transform:skewX(14deg)}
  .hudImg{position:absolute;pointer-events:none;filter:drop-shadow(0 2px 6px #000)}
  .hudImg.p1{top:calc(4px + env(safe-area-inset-top));left:calc(7% + 36% - 20px);width:64px;height:64px;
    border-radius:50%;border:3px solid #b06a30;object-fit:cover}
  .hudImg.p2{top:calc(4px + env(safe-area-inset-top));right:calc(7% + 36% - 20px);width:64px;height:64px;
    border-radius:50%;border:3px solid #3a6a9a;object-fit:cover}
  .hudImg.em{top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:58px;height:58px}
  .bar{height:100%;width:100%;background:linear-gradient(180deg,#ffd27a,#ff7a26 60%,#c33d10);
    transition:width .12s ease-out}
  #wrap2 .bar{margin-left:auto;background:linear-gradient(180deg,#bcd6ff,#3f8cff 60%,#143c9c)}
  .bar.low{background:linear-gradient(180deg,#ff9a8a,#e02020)!important;animation:pulse .5s infinite alternate}
  @keyframes pulse{to{filter:brightness(1.6)}}
  .tag{position:absolute;top:calc(44px + env(safe-area-inset-top));font-size:13px;letter-spacing:2px}
  #tag1{left:8%} #tag2{right:8%}
  .meterWrap{position:absolute;top:calc(34px + env(safe-area-inset-top));width:30%;height:7px;background:rgba(20,10,14,.75);border:1px solid #4a3020}
  #mw1{left:3%} #mw2{right:3%}
  .meter{height:100%;width:0%;background:linear-gradient(90deg,#ffe9a0,#ff9a30);transition:width .15s}
  #mw2 .meter{margin-left:auto;background:linear-gradient(90deg,#cfe9ff,#30a0ff)}
  .combo{position:absolute;top:calc(64px + env(safe-area-inset-top));font-size:22px;color:#ffe9b0;letter-spacing:2px}
  #combo1{left:5%} #combo2{right:5%}
  #msg{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:64px;letter-spacing:8px;
    opacity:0;transform:scale(2.2);color:#ffcf6a}
  #msg.show{opacity:1;transform:scale(1);transition:all .25s cubic-bezier(.2,2,.4,1)}
  #msg.ko{color:#ff3020;font-size:96px}
  .pad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:none}
  #padL{left:12px;display:flex;gap:10px;align-items:flex-end}
  #padR{right:10px;width:236px;height:178px}
  #padR .btn{position:absolute}
  #padR [data-k="p"]{right:0;bottom:46px}
  #padR [data-k="k"]{right:80px;bottom:6px}
  #padR [data-k="h"]{right:80px;bottom:92px}
  #padR [data-k="b"]{right:160px;bottom:46px}
  #padR [data-k="s"]{right:176px;bottom:118px}
  #padR [data-k="u"]{right:104px;bottom:128px}
  .btn{width:72px;height:72px;border-radius:50%;border:none;background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;pointer-events:auto;
    filter:drop-shadow(0 3px 8px #000)}
  .btn .icon{width:56%;height:56%;object-fit:contain;pointer-events:none}
  .icon.l{transform:scaleX(-1)} .icon.u{transform:rotate(-90deg)}
  .barFrame{position:absolute;inset:-7px -12px;background-size:100% 100%;background-repeat:no-repeat;
    pointer-events:none;filter:drop-shadow(0 2px 6px #000)}
  .clip{position:absolute;inset:0;overflow:hidden}
  .btn.sm{width:54px;height:54px}
  .btn:active{filter:brightness(1.6)}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);pointer-events:auto}
  .koBox{font:96px Impact;color:#ff3020;text-shadow:0 0 30px #f00;text-align:center}
  .koBox span{display:block;font-size:20px;color:#ffd9a0;letter-spacing:4px;margin-top:10px}
  .ovl{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;
    justify-content:center;background:rgba(8,4,10,.82);pointer-events:auto;
    font-family:Impact,'Arial Black',sans-serif;color:#ffd9a0}
  .ovl h1{font-size:64px;letter-spacing:10px;margin:0;color:#ff9a50;text-shadow:0 0 30px #a03010}
  .ovl .pt{font-size:40px}
  .sub{letter-spacing:4px;font-size:14px;color:#c9a080}
  .record{font-size:13px;letter-spacing:2px;color:#9a8a70}
  .mb{pointer-events:auto;background:rgba(60,26,16,.8);border:2px solid #7a4a30;color:#ffd9a0;
    font:22px Impact,sans-serif;letter-spacing:4px;padding:10px 42px}
  .mb.sm{font-size:15px;padding:6px 18px}
  .mb:active{background:rgba(255,140,60,.5)}
  .row{display:flex;gap:12px;align-items:center}
  .ql{font-size:15px;letter-spacing:2px;min-width:130px;text-align:center}
  .netBox{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:86%}
  .nt{font-size:14px;letter-spacing:2px;color:#c9a080}
  textarea{width:100%;height:64px;font:10px monospace;background:#160b10;color:#ffd9a0;
    border:1px solid #7a4a30;padding:6px}
  .help{font-size:12px;letter-spacing:2px;color:#8a7a68;text-align:center;line-height:1.8}
  #boot{position:fixed;inset:0;background:#120a10;color:#ff9a50;display:flex;align-items:center;
    justify-content:center;font:28px Impact;letter-spacing:6px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="barWrap" id="wrap1"><div class="clip"><div class="bar" id="hp1"></div></div></div>
  <div class="barWrap" id="wrap2"><div class="clip"><div class="bar" id="hp2"></div></div></div>
  <div class="meterWrap" id="mw1"><div class="meter" id="m1"></div></div>
  <div class="meterWrap" id="mw2"><div class="meter" id="m2"></div></div>
  <div class="tag" id="tag1">ASHFALL</div><div class="tag" id="tag2">VANGUARD</div>
  <div class="combo" id="combo1"></div><div class="combo" id="combo2"></div>
  <div id="msg"></div>
</div>
<div class="pad" id="padL">
  <div class="btn" data-k="left">◀</div>
  <div class="btn" data-k="up">▲</div>
  <div class="btn" data-k="right">▶</div>
</div>
<div class="pad" id="padR">
  <div class="btn" data-k="block">B</div>
  <div class="btn" data-k="h">H</div>
  <div class="btn" data-k="k">K</div>
  <div class="btn" data-k="p">P</div>
  <div class="btn sm" data-k="s">SP</div>
  <div class="btn sm" data-k="u">ULT</div>
</div>
<div id="pbtn" class="btn sm" data-act="pause" style="display:none;position:fixed;top:calc(70px + env(safe-area-inset-top));right:2%">II</div>
<div id="menu" class="ovl">
  <h1>ASHFALL</h1>
  <div class="sub">2.5D WEB 3D FIGHTER · DUSK CIRCUIT</div>
  <div class="record" id="record"></div>
  <button class="mb" data-act="fight">FIGHT</button>
  <div class="row">
    <button class="mb sm" data-act="train">TRAINING</button>
    <button class="mb sm" data-act="arcade">ARCADE</button>
  </div>
  <div class="row">
    <button class="mb sm" data-act="host">HOST DUEL</button>
    <button class="mb sm" data-act="join">JOIN DUEL</button>
  </div>
  <div class="row">
    <button class="mb sm" data-act="q-">◀</button>
    <span id="qlabel" class="ql"></span>
    <button class="mb sm" data-act="q+">▶</button>
  </div>
  <button class="mb sm" id="hapBtn" data-act="hap"></button>
  <div class="help">TOUCH ◀ ▲ ▶ · P K H SP ULT B<br>KEYS A D · W · S · J K L · U SP · I ULT · ESC PAUSE</div>
</div>
<div id="pause" class="ovl" style="display:none">
  <h1 class="pt">PAUSED</h1>
  <button class="mb" data-act="resume">RESUME</button>
  <button class="mb" data-act="rematch2">REMATCH</button>
  <button class="mb" data-act="menu">QUIT TO MENU</button>
</div>
<div id="netov" class="ovl" style="display:none"></div>
<div id="overlay"></div>
<div id="boot">ASHFALL</div>
<script src="bundle.9e36e933.js"></script>
</body>
</html>
